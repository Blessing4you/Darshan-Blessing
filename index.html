<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sarva Dharma Darshan - Spiritual Blessings & Dakshina</title>
    <style>
        :root {
            --saffron-dark: #CC5A01;
            --saffron-base: #FF6F00;
            --saffron-light: #FF8F00;
            --gold: #FFD700;
            --sacred-bg: #FFF3E0; 
            --charcoal: #1C0D02;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--sacred-bg);
            color: var(--charcoal);
            overflow-x: hidden;
        }

        header {
            background: linear-gradient(135deg, #4A1504, var(--saffron-dark));
            color: #fff;
            text-align: center;
            padding: 3.5rem 1rem;
            border-bottom: 6px solid var(--gold);
            box-shadow: 0 4px 20px rgba(0,0,0,0.25);
        }

        header h1 {
            font-size: 2.6rem;
            color: var(--gold);
            margin-bottom: 0.6rem;
            letter-spacing: 1.5px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        header p {
            font-size: 1.15rem;
            opacity: 0.95;
            font-style: italic;
            font-weight: 300;
            color: #FFE0B2;
        }

        .container {
            max-width: 1200px;
            margin: 3.5rem auto;
            padding: 0 1.5rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 3rem;
        }

        .card {
            background: #FFFBF2;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(204, 90, 1, 0.12);
            border: 2px solid #FFE0B2;
            transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1), box-shadow 0.4s ease;
            cursor: pointer;
            position: relative;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 35px rgba(204, 90, 1, 0.25);
            border-color: var(--saffron-light);
        }

        .image-container {
            position: relative;
            height: 380px;
            background-color: #1A0A00;
            overflow: hidden;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        .card:hover .image-container img {
            transform: scale(1.05);
        }

        .click-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(74, 21, 4, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .card:hover .click-overlay {
            opacity: 1;
        }

        .click-overlay span {
            background: var(--gold);
            color: #000;
            padding: 0.7rem 1.5rem;
            border-radius: 30px;
            font-weight: bold;
            font-size: 0.95rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .info {
            padding: 1.5rem;
            text-align: center;
            border-top: 1px solid #FFE0B2;
        }

        .info h2 {
            font-size: 1.4rem;
            color: #5D1F00;
            margin-bottom: 0.3rem;
        }

        .info .religion-tag {
            font-size: 0.85rem;
            text-transform: uppercase;
            color: var(--saffron-dark);
            font-weight: 700;
            letter-spacing: 1px;
        }

        .blessing-flash {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 10px;
            height: 10px;
            background: radial-gradient(circle, rgba(255,255,255,1) 0%, rgba(255,235,59,0.95) 25%, rgba(255,111,0,0.7) 55%, rgba(255,255,255,0) 100%);
            border-radius: 50%;
            z-index: 2000;
            pointer-events: none;
            opacity: 0;
        }

        @keyframes burst-animation {
            0% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.3;
            }
            20% {
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -50%) scale(350);
                opacity: 0;
            }
        }

        .blessing-flash.active {
            animation: burst-animation 1.5s cubic-bezier(0.1, 0.8, 0.25, 1) forwards;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(28, 13, 2, 0.97);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease;
            padding: 1rem;
        }

        .modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .darshan-container {
            background: linear-gradient(180deg, #3E1404 0%, #1A0700 100%);
            border: 3px solid var(--gold);
            border-radius: 20px;
            max-width: 520px;
            width: 100%;
            padding: 2.2rem 2rem;
            text-align: center;
            color: #fff;
            position: relative;
            transform: scale(0.85);
            transition: transform 0.5s cubic-bezier(0.19, 1, 0.22, 1);
            box-shadow: 0 0 50px rgba(255, 111, 0, 0.4);
        }

        .modal.active .darshan-container {
            transform: scale(1);
        }

        .darshan-frame {
            width: 100%;
            height: 360px;
            border: 3px double var(--gold);
            border-radius: 12px;
            margin-bottom: 1.2rem;
            overflow: hidden;
            background: #000;
            box-shadow: 0 0 25px rgba(0,0,0,0.9);
            position: relative;
        }

        .darshan-frame img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .sacred-phrase {
            font-size: 1.35rem;
            color: var(--gold);
            margin: 0.6rem 0;
            font-weight: 600;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }

        .blessing-text {
            font-size: 1.05rem;
            opacity: 0.9;
            line-height: 1.5;
            margin-bottom: 1.5rem;
            color: #FFE0B2;
        }

        .action-layout {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .gpay-btn {
            background: linear-gradient(135deg, #FF6F00, #E65100);
            color: white;
            border: 2px solid var(--gold);
            padding: 0.9rem;
            border-radius: 8px;
            font-size: 1.05rem;
            font-weight: bold;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            text-decoration: none;
            box-shadow: 0 4px 18px rgba(230, 81, 0, 0.5);
            text-transform: uppercase;
        }

        .gpay-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(255, 111, 0, 0.7);
        }

        /* NEW VISIBLE UPI ID BADGE DISPLAY STYLES */
        .upi-display-box {
            background: rgba(255, 255, 255, 0.08);
            border: 1px dashed rgba(255, 215, 0, 0.4);
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
        }

        .upi-text-label {
            font-size: 0.8rem;
            color: #FFE0B2;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-align: left;
        }

        .upi-address-string {
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            color: var(--gold);
            font-size: 0.95rem;
            word-break: break-all;
        }

        .copy-badge-btn {
            background: var(--gold);
            color: #000;
            border: none;
            padding: 0.35rem 0.7rem;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.75rem;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .copy-badge-btn:hover {
            background: #fff;
        }

        .close-btn {
            background: transparent;
            color: rgba(255,255,255,0.6);
            border: 1px solid rgba(255,255,255,0.25);
            padding: 0.6rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .close-btn:hover {
            color: #fff;
            border-color: #fff;
        }

        footer {
            text-align: center;
            padding: 4rem 2rem;
            font-size: 0.95rem;
            color: #5D1F00;
            background-color: #FFE0B2;
            border-top: 2px solid var(--saffron-light);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1>Sacred Indian Darshan Portal</h1>
        <p>Touch any divine image to reveal the blessing light and tender your offering</p>
    </header>

    <div class="container">
        <div class="grid" id="faith-grid"></div>
    </div>

    <div class="blessing-flash" id="light-flash"></div>

    <div class="modal" id="darshan-modal" onclick="closeDarshan()">
        <div class="darshan-container" onclick="event.stopPropagation()">
            <div class="darshan-frame">
                <img id="modal-img" src="" alt="Sacred Idol">
            </div>
            <h2 id="modal-name" style="color: var(--gold); font-size: 1.7rem;"></h2>
            <p class="sacred-phrase" id="modal-scripture"></p>
            <p class="blessing-text" id="modal-blessing"></p>
            
            <div class="action-layout">
                <!-- NEW VISIBLE UPI PANEL CONTAINER -->
                <div class="upi-display-box">
                    <div style="text-align: left;">
                        <div class="upi-text-label">UPI ID / GPay Address:</div>
                        <div class="upi-address-string" id="visible-upi-string">ssimononline-1@okhdfcbank</div>
                    </div>
                    <button class="copy-badge-btn" id="copy-action-button" onclick="copyUpiToClipboard()">Copy ID</button>
                </div>

                <a id="modal-upi-link" href="#" class="gpay-btn">
                     Contribute to Website Hosting & Maintainance
                </a>
                <button class="close-btn" onclick="closeDarshan()">Return to Sanctuary</button>
            </div>
        </div>
    </div>

    <footer>
        <p>© 2026 Indian Digital Sanctuary. Designed for unified spiritual contemplation and peace.</p>
    </footer>

    <script>
        const YOUR_GPAY_UPI_ID = "ssimononline-1@okhdfcbank"; 
        const TEMPLE_TRUST_NAME = "Free Sacred Darshan";

        const sanctuaries = [
            {
                name: "Sanatana Dharma (Hinduism)",
                tag: "Universal Cosmic Assembly",
                imgUrl: "https://image.pollinations.ai/prompt/A%20highly%20detailed%20and%20realistic%20traditional%20Indian%20temple%20sanctum%20sanctorum%20with%20a%20divine%20assembly%20of%20famous%20deities%20including%20Lord%20Ganesha,%20Lord%20Shiva,%20Maa%20Durga,%20and%20Lord%20Krishna.%20The%20idols%20are%20adorned%20in%20exquisite%20silk%20vastras,%20intricate%20gold%20jewelry,%20and%20vibrant%20garlands%20of%20fresh%20marigold%20and%20jasmine%20flowers.%20Warm,%20sacred%20glow%20from%20burning%20brass%20oil%20lamps%20\(diyas\)%20and%20gentle%20wisps%20of%20incense%20smoke%20create%20a%20blessed,%20peaceful,%20and%20authentic%20Darshan%20atmosphere.?width=800&height=1000&nologo=true",
                scripture: "Om Asato Ma Sadgamaya",
                blessing: "May supreme spiritual alignment, continuous prosperity, radiant health, and unwavering mental peace be granted to you and your family."
            },
            {
                name: "Islam",
                tag: "Hazratbal & Sufi Holy Shrines",
                imgUrl: "https://image.pollinations.ai/prompt/A%20breathtaking,%20highly%20realistic%20interior%20of%20a%20historic%20Indian%20mosque%20shrine,%20showcasing%20exquisite%20marble%20carvings,%20elegant%20warm%20hanging%20glass%20lamps,%20and%20an%20atmosphere%20of%20profound%20serenity.%20Soft%20morning%20sunlight%20streams%20through%20intricate%20geometric%20jali%20windows,%20illuminating%20peaceful%20prayer%20mats.?width=800&height=1000&nologo=true",
                scripture: "Bismillah ir-Rahman ir-Rahim",
                blessing: "May the Ultimate Protector shower your household with absolute divine mercy, endless health, graceful tranquility, and boundless guidance."
            },
            {
                name: "Christianity",
                tag: "Basilica of Our Lady of Good Health",
                imgUrl: "https://image.pollinations.ai/prompt/A%20magnificent,%20highly%20realistic%20altar%20of%20an%20Indian%20basilica%20cathedral,%20featuring%20a%20beautifully%20adorned%20statue%20of%20Mother%20Mary%20holding%20baby%20Jesus,%20dressed%20in%20traditional%20fine%20silk%20garments.%20Soft%20altar%20candles%20glow%20warmly%20amidst%20fresh%20white%20lilies,%20casting%20a%20heavenly,%20peaceful%20blessing%20light.?width=800&height=1000&nologo=true",
                scripture: "The Lord is My Shepherd",
                blessing: "May unconditional divine grace, miraculous healing, supreme comfort, and protective love shield you from all life tribulations."
            },
            {
                name: "Sikhism",
                tag: "Sri Harmandir Sahib (Golden Temple)",
                imgUrl: "https://image.pollinations.ai/prompt/A%20profoundly%20accurate%20and%20highly%20detailed%20interior%20view%20of%20a%20sacred%20Gurdwara,%20focused%20reverently%20on%20the%20Sri%20Guru%20Granth%20Sahib%20seated%20magnificently%20under%20a%20royal%20gilded%20canopy%20\(Palki%20Sahib\).%20Exquisite%20flower%20decorations,%20glowing%20chandeliers,%20and%20deeply%20peaceful%20devotional%20energy.?width=800&height=1000&nologo=true",
                scripture: "Ek Onkar Satnam",
                blessing: "Receive the timeless blessings of immense inner strength, absolute humility, righteous courage, and communal prosperity."
            },
            {
                name: "Buddhism",
                tag: "Mahabodhi Mahavihara Santam",
                imgUrl: "https://image.pollinations.ai/prompt/A%20serene%20and%20highly%20realistic%20golden%20statue%20of%20Lord%20Buddha%20in%20deep%20meditative%20Dhyana%20mudra%20inside%20an%20ancient%20Indian%20monastery%20shrine.%20Soft%20glow%20from%20brass%20lamps%20illuminates%20marigold%20petals,%20with%20gentle%20wisps%20of%20incense%20creating%20complete%20mindful%20calm.?width=800&height=1000&nologo=true",
                scripture: "Buddham Sharanam Gacchami",
                blessing: "May your mind achieve absolute liberation from stress, complete clarity of thought, perfect balance, and pure compassion."
            },
            {
                name: "Jainism",
                tag: "Shree Dilwara Tirthankar",
                imgUrl: "https://image.pollinations.ai/prompt/An%20exquisite,%20highly%20realistic%20white%20marble%20idol%20of%20a%20revered%20Jain%20Tirthankara%20seated%20in%20deep%20padmasana%20posture%20inside%20a%20magnificently%20carved%20marble%20temple.%20The%20atmosphere%20is%20immaculately%20clean,%20pure,%20peaceful,%20reflecting%20absolute%20non-violence%20and%20spiritual%20triumph.?width=800&height=1000&nologo=true",
                scripture: "Ahinsa Paramo Dharma",
                blessing: "Blessed with deep self-discipline, inner purity, non-violence across all your actions, and total liberation from negative karma."
            }
        ];

        function playSacredBell() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                const ctx = new AudioContext();
                const osc1 = ctx.createOscillator();
                const gain1 = ctx.createGain();
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(659.25, ctx.currentTime);
                
                const osc2 = ctx.createOscillator();
                const gain2 = ctx.createGain();
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(329.63, ctx.currentTime);

                gain1.gain.setValueAtTime(0.6, ctx.currentTime);
                gain1.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 3.0);
                gain2.gain.setValueAtTime(0.3, ctx.currentTime);
                gain2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 2.5);

                osc1.connect(gain1); gain1.connect(ctx.destination);
                osc2.connect(gain2); gain2.connect(ctx.destination);
                osc1.start(); osc2.start();
                osc1.stop(ctx.currentTime + 3.0); osc2.stop(ctx.currentTime + 2.5);
            } catch (e) { console.log("Audio ready."); }
        }

        const grid = document.getElementById('faith-grid');
        sanctuaries.forEach((shrine, index) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="image-container">
                    <img src="${shrine.imgUrl}" alt="${shrine.name}">
                    <div class="click-overlay"><span>Receive Blessing</span></div>
                </div>
                <div class="info">
                    <h2>${shrine.name}</h2>
                    <span class="religion-tag">${shrine.tag}</span>
                </div>
            `;
            card.onclick = () => activateBlessing(index);
            grid.appendChild(card);
        });

        const modal = document.getElementById('darshan-modal');
        const flash = document.getElementById('light-flash');
        
        function activateBlessing(index) {
            flash.classList.remove('active');
            void flash.offsetWidth; 
            flash.classList.add('active');
            playSacredBell();

            setTimeout(() => {
                const data = sanctuaries[index];
                document.getElementById('modal-img').src = data.imgUrl;
                document.getElementById('modal-img').alt = data.name;
                document.getElementById('modal-name').innerText = data.name;
                document.getElementById('modal-scripture').innerText = data.scripture;
                document.getElementById('modal-blessing').innerText = data.blessing;
                
                const EncodedOrg = encodeURIComponent(TEMPLE_TRUST_NAME);
                const EncodedNote = encodeURIComponent(`Hosting and Maintainance Support`);
                const upiUrl = `upi://pay?pa=${YOUR_GPAY_UPI_ID}&pn=${EncodedOrg}&tn=${EncodedNote}&cu=INR`;
                
                document.getElementById('modal-upi-link').href = upiUrl;
                
                // Reset copy button status text
                document.getElementById('copy-action-button').innerText = "Copy ID";
                document.getElementById('copy-action-button').style.background = "var(--gold)";

                modal.classList.add('active');
            }, 300);
        }

        function copyUpiToClipboard() {
            const upiString = document.getElementById('visible-upi-string').innerText;
            navigator.clipboard.writeText(upiString).then(() => {
                const btn = document.getElementById('copy-action-button');
                btn.innerText = "Copied! ?";
                btn.style.background = "#4CAF50";
                btn.style.color = "#fff";
            }).catch(err => {
                alert("Failed to copy automatically. Please note down: " + upiString);
            });
        }

        function closeDarshan() {
            modal.classList.remove('active');
            flash.classList.remove('active');
        }
    </script>
</body>
</html>
